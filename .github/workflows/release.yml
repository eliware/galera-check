name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            binary: target/release/galera-check
          - os: windows-latest
            target: windows-x86_64
            binary: target/release/galera-check.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo build --release --locked
      - name: Prepare release artifact
        shell: bash
        run: |
          cp "${{ matrix.binary }}" "galera-check-${{ matrix.target }}"
          test -s "galera-check-${{ matrix.target }}"
          sha256sum "galera-check-${{ matrix.target }}" > "galera-check-${{ matrix.target }}.sha256"
          sha256sum --check "galera-check-${{ matrix.target }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: galera-check-${{ matrix.target }}
          path: |
            galera-check-${{ matrix.target }}
            galera-check-${{ matrix.target }}.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          case "${RELEASE_TAG}" in
            v*) ;;
            *) echo "Release tag must start with v: ${RELEASE_TAG}" >&2; exit 1 ;;
          esac
      - uses: actions/download-artifact@v4
        with:
          pattern: galera-check-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: galera-check ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            galera-check-*
